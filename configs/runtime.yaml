runtime:
  identity:
    enabled: false
    allow_loopback_bypass: true
    trusted_proxy_cidrs: []
    actor_header: X-LOGRISK-Actor
    roles_header: X-LOGRISK-Roles
    request_id_header: X-Request-ID
    write_roles: []
  retention:
    enabled: false
    completed_days: 30
    trace_days: 30
    cache_days: 14
  quota:
    soft_limit_bytes: 5368709120
    hard_limit_bytes: 10737418240

drain3_runtime:
  parameter_extraction_mode: off

large_file:
  process_start_method: spawn
  max_drain_workers: 4
  reserve_cpu_cores: 1
  max_upload_bytes: 524288000
  max_decompressed_bytes: 1073741824
  max_compression_ratio: 100
  max_line_bytes: 1048576

drain_quality:
  enabled: true
  annotation_sample_size: 1000
  samples_per_cluster: 20
  high_wildcard_threshold: 0.60
  singleton_warning_threshold: 0.30
  order_stability_runs: 4
  critical_risk_recall_min: 1.0
  over_merge_rate_max: 0.02
  normal_false_positive_rate_max: 0.02
