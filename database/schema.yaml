schema_version: 12
database: logrisk
description: LOGRISK 双模式运行时数据字典；SQLite 是默认本地实现，PostgreSQL 用于显式配置的外部生产部署。
authoritative_ddl:
  sqlite: database/migrations/
  postgres: database/postgres/migrations/
runtime_providers:
  sqlite: 默认；state/logrisk.sqlite3，启用 foreign_keys、WAL、busy_timeout 和短事务
  postgres: 仅外部实例；通过 LOGRISK_DATABASE_PROVIDER=postgres 与 LOGRISK_DATABASE_URL 显式启用，不自动回退
conventions:
  timestamps: SQLite UTC ISO-8601 text; PostgreSQL timestamptz
  booleans: SQLite INTEGER 0/1; PostgreSQL BOOLEAN
  json: SQLite TEXT with application validation; PostgreSQL JSONB（app_settings.value_json 保持 TEXT，兼容 INI 与 JSON 设置）
  identifiers: SQLite TEXT; PostgreSQL text（后续可按领域改为 uuid）
  autoincrement: SQLite INTEGER PRIMARY KEY AUTOINCREMENT; PostgreSQL bigint generated by default as identity
column_patterns:
  "*_id": 领域实体标识或外键；外键约束以 authoritative_ddl 为准
  "*_json": 经应用层 Schema 校验的完整快照或扩展字段
  "*_at": UTC ISO-8601 时间戳
  status: 领域状态；允许值由应用层或 DDL CHECK 约束
tables:
  schema_migrations:
    description: 已执行的数据库迁移版本和文件完整性校验
    primary_key: version
    columns: {version: 迁移序号, name: SQL 文件名, sha256: SQL 文件摘要, applied_at: 应用时间}
  legacy_imports:
    description: 旧文件幂等导入记录
    primary_key: source_path
    columns: {source_path: 旧状态文件绝对路径, source_sha256: 导入时文件摘要, records_imported: 导入记录数, imported_at: 导入时间}
  app_settings:
    description: 当前默认 Profile、活动配置等应用设置；value_json 兼容 JSON 字符串和 Drain3 INI 内容
    primary_key: setting_key
    columns: {setting_key: 设置键, value_json: 设置值, updated_at: 更新时间}
  provider_connections:
    description: Ollama、OpenAI-compatible 与受控扩展模型连接；只保存凭据环境变量名与非敏感适配器配置
    primary_key: connection_id
    constraints: provider 仅允许 ollama/openai_compatible/extension；扩展适配器必须在代码 allow-list 中注册；超时必须大于 0；启用与默认标志为布尔值
    columns: {connection_id: 连接标识, display_name: 页面显示名, provider: Provider 类型, base_url: 服务根地址, api_key_env: OpenAI API Key 环境变量名而非密钥, adapter_id: 扩展适配器标识, credential_envs_json: 逻辑凭据名到环境变量名的映射而非凭据值, extension_config_json: 扩展适配器的非敏感 JSON 配置, timeout_seconds: HTTP 超时秒数, enabled: 是否允许新任务使用, is_default: 是否为默认连接, created_at: 创建时间, updated_at: 更新时间}
  model_profiles:
    description: 绑定连接的模型参数、Prompt、上下文预算和可选 Token 单价；价格位于 profile_json
    primary_key: profile_id
    foreign_keys: {connection_id: provider_connections.connection_id}
    indexes: [idx_model_profiles_connection(connection_id)]
    columns: {profile_id: 模型画像标识, connection_id: Provider 连接, model: Provider 模型名, display_name: 页面显示名, enabled: 是否可选, structured_output_mode: json_schema/json_object/prompt_only, profile_json: 完整模型参数和预算, created_at: 创建时间, updated_at: 更新时间}
  prompt_templates:
    description: Prompt 元数据及当前版本指针
    primary_key: prompt_id
    columns: {prompt_id: Prompt 标识, analysis_type: 分析任务类型, display_name: 页面显示名, description: 用途说明, status: 生命周期状态, is_default: 是否为任务默认 Prompt, current_version: 当前版本号, created_at: 创建时间, updated_at: 更新时间}
  prompt_versions:
    description: 不可变 Prompt 内容版本
    primary_key: [prompt_id, version]
    foreign_keys: {prompt_id: prompt_templates.prompt_id}
    columns: {prompt_id: Prompt 标识, version: 递增版本号, content: Prompt 正文, content_sha256: 正文摘要, note: 版本备注, created_at: 创建时间}
  feature_jobs:
    description: 特征识别任务及创建时锁定的连接和模型快照
    primary_key: job_id
    foreign_keys: {model_profile_id: model_profiles.profile_id}
    columns: {job_id: 任务标识, status: 任务状态, model_profile_id: 所选 Profile, connection_snapshot_json: 创建时连接快照, profile_snapshot_json: 创建时 Profile 快照, job_json: 完整任务聚合状态, created_at: 创建时间, completed_at: 完成时间, updated_at: 更新时间}
  feature_job_entities:
    description: 任务内风险实体识别状态
    primary_key: [job_id, entity_id]
    foreign_keys: {job_id: feature_jobs.job_id ON DELETE CASCADE}
    columns: {job_id: 所属任务, entity_id: 风险实体标识, status: 实体处理状态, risk_score: 风险分, entity_json: 聚合且脱敏的实体证据, updated_at: 更新时间}
  feature_candidates:
    description: 模型或规则产生的待审批特征
    primary_key: candidate_id
    foreign_keys: {job_id: feature_jobs.job_id ON DELETE CASCADE}
    columns: {candidate_id: 候选特征标识, job_id: 所属任务, entity_id: 来源风险实体, status: 审批状态, candidate_json: 特征内容和 Evidence 引用, created_at: 创建时间, updated_at: 更新时间}
  feature_job_events:
    description: 特征任务顺序事件流
    primary_key: [job_id, sequence]
    foreign_keys: {job_id: feature_jobs.job_id ON DELETE CASCADE}
    columns: {job_id: 所属任务, sequence: 任务内递增序号, event_type: 事件类型, event_json: 事件详情, created_at: 发生时间}
  approved_rules:
    description: 人工批准且可复用的版本化规则资产；仅 active 状态参与匹配
    primary_key: rule_id
    constraints: signature 唯一；status 为 active/disabled/under_review/deprecated/archived；current_version 大于 0
    indexes: [idx_approved_rules_status(status)]
    columns: {rule_id: 规则标识, signature: 去重和匹配签名, feature_type: 特征类别, rule_json: 当前规则、Evidence 和 Lineage 快照, approved_at: 首次批准时间, updated_at: 更新时间, status: 生命周期状态, current_version: 当前规则版本, next_review_at: 下次复审时间, schema_version: 规则资产结构版本}
  rule_versions:
    description: 不可变的批准规则版本快照；状态变更、审批更新和回滚均追加新版本
    primary_key: [rule_id, version]
    foreign_keys: {rule_id: approved_rules.rule_id ON DELETE CASCADE}
    columns: {rule_id: 规则标识, version: 单规则递增版本, rule_json: 不可变规则快照, change_type: rule_created/rule_updated/status_changed/rolled_back, change_reason: 人工变更原因, operator: 操作者, created_at: 版本创建时间, schema_version: 版本结构标识}
  rule_feedback:
    description: 人工确认有效或误报的追加式复核反馈
    primary_key: feedback_id
    foreign_keys: {rule_id: approved_rules.rule_id ON DELETE CASCADE}
    indexes: [idx_rule_feedback_rule_time(rule_id, created_at DESC)]
    columns: {feedback_id: 反馈标识, rule_id: 规则标识, outcome: confirmed/false_positive, cluster: 反馈关联集群, job_id: 关联任务, entity_id: 关联实体, note: 复核备注, operator: 操作者, created_at: 反馈时间, schema_version: 反馈结构标识}
  rule_audit_events:
    description: 规则审批、状态、反馈和回滚操作的追加式审计事件
    primary_key: event_id
    foreign_keys: {rule_id: approved_rules.rule_id ON DELETE CASCADE}
    indexes: [idx_rule_audit_rule_time(rule_id, created_at DESC)]
    columns: {event_id: 审计事件标识, rule_id: 规则标识, event_type: 事件类型, from_version: 变更前版本, to_version: 变更后或关联版本, event_json: 脱敏事件详情, operator: 操作者, created_at: 事件时间, schema_version: 审计结构标识}
  rule_reuse_events:
    description: 批准规则复用审计记录
    primary_key: event_id
    foreign_keys: {rule_id: approved_rules.rule_id}
    indexes: [idx_rule_reuse_rule_time(rule_id, reused_at DESC)]
    columns: {event_id: 自增事件标识, rule_id: 命中规则, job_id: 命中任务, entity_id: 命中实体, reused_at: 复用时间, cluster: 命中集群, schema_version: 复用事件结构标识}
  ai_traces:
    description: 脱敏后的模型调用观测记录
    primary_key: trace_id
    indexes: [idx_ai_traces_created(created_at DESC), idx_ai_traces_job(job_id)]
    columns: {trace_id: 调用追踪标识, job_id: 所属任务, provider: Provider 类型, model: 模型名, status: 调用或校验状态, prompt_id: Prompt 标识, prompt_hash: Prompt 内容摘要, latency_ms: 请求耗时毫秒, trace_json: 脱敏请求元数据与模型输出, created_at: 创建时间}
  observability_runs:
    description: 以任务为边界聚合输入、模板、模型、校验和审批阶段的 Observation
    primary_key: observation_id
    indexes: [idx_observability_runs_status_updated(status, updated_at DESC)]
    columns: {observation_id: Observation 标识, job_id: 唯一关联任务, input_job_id: 可选输入处理任务, status: running/completed/failed, attributes_json: 脱敏任务属性, schema_version: 结构版本, created_at: 创建时间, updated_at: 更新时间}
  observability_spans:
    description: Observation 内可筛选的阶段 Span；仅记录脱敏属性和 Trace 引用
    primary_key: span_id
    foreign_keys: {observation_id: observability_runs.observation_id ON DELETE CASCADE, parent_span_id: observability_spans.span_id}
    indexes: [idx_observability_spans_run_time(observation_id, started_at), idx_observability_spans_stage_status(stage, status, started_at DESC), idx_observability_spans_trace(trace_id)]
    columns: {span_id: Span 标识, observation_id: 所属 Observation, trace_id: 可选模型 Trace, parent_span_id: 可选父 Span, name: 阶段事件名称, stage: 标准阶段, status: running/success/failed/skipped, started_at: 开始时间, ended_at: 结束时间, duration_ms: 耗时毫秒, attributes_json: 脱敏属性, idempotency_key: 事件幂等键, schema_version: 结构版本, created_at: 创建时间, updated_at: 更新时间}
  replay_runs:
    description: 历史校验或明确确认后的原模型重放；结果隔离且不写候选、规则或审批
    primary_key: replay_id
    foreign_keys: {observation_id: observability_runs.observation_id ON DELETE SET NULL, source_trace_id: ai_traces.trace_id}
    indexes: [idx_replay_runs_source_created(source_trace_id, created_at DESC), idx_replay_runs_status_updated(status, updated_at DESC)]
    columns: {replay_id: Replay 标识, observation_id: 可选来源 Observation, source_trace_id: 来源 Trace, mode: historical/model, status: pending/running/completed/failed, idempotency_key: 创建请求幂等键, snapshot_json: 锁定的 Prompt/Profile/Provider/Evidence 快照, result_json: 脱敏结果与差异, error_code: 稳定错误码, error_message: 脱敏错误信息, schema_version: 结构版本, created_at: 创建时间, updated_at: 更新时间, completed_at: 完成时间}
  replay_events:
    description: Replay 执行过程的追加式事件
    primary_key: [replay_id, sequence]
    foreign_keys: {replay_id: replay_runs.replay_id ON DELETE CASCADE}
    columns: {replay_id: 所属 Replay, sequence: 递增序号, event_type: 事件类型, event_json: 脱敏事件详情, created_at: 创建时间}
  runtime_policies:
    description: 生产运行中心的 Retention 和存储配额策略；通过乐观版本校验更新
    primary_key: policy_id
    columns: {policy_id: 默认策略标识, policy_json: 脱敏运行策略, version: 递增版本, schema_version: 结构版本, created_at: 创建时间, updated_at: 更新时间}
  runtime_maintenance_runs:
    description: Retention 等维护操作的 dry-run 或实际执行记录
    primary_key: run_id
    indexes: [idx_runtime_maintenance_status_updated(status, updated_at DESC)]
    columns: {run_id: 维护运行标识, action: 维护动作, mode: dry_run/execute, status: running/completed/failed, summary_json: 脱敏统计摘要, error_code: 稳定错误码, error_message: 脱敏错误, actor: 外部身份操作人, request_id: 请求标识, schema_version: 结构版本, created_at: 创建时间, updated_at: 更新时间, completed_at: 完成时间}
  runtime_quota_snapshots:
    description: 状态目录和输出目录的聚合存储用量快照
    primary_key: snapshot_id
    columns: {snapshot_id: 用量快照标识, usage_json: 文件数量和字节聚合值, schema_version: 结构版本, created_at: 采样时间}
  runtime_audit_events:
    description: 外部身份驱动的运行时操作追加式审计；仅保存脱敏元数据
    primary_key: audit_id
    indexes: [idx_runtime_audit_created(created_at DESC, audit_id DESC), idx_runtime_audit_resource(resource_type, resource_id, created_at DESC)]
    columns: {audit_id: 审计标识, action: 操作名称, resource_type: 资源类别, resource_id: 资源标识, actor: PACAS/RBAC 传入的操作人, roles_json: 角色名称列表, request_id: 请求标识, outcome: success/failed/denied, attributes_json: 脱敏操作元数据, schema_version: 结构版本, created_at: 发生时间}
  release_validations:
    description: 发布就绪中心的不可变校验运行；只保存脱敏摘要，不保存原始日志、凭据或模型内容
    primary_key: validation_id
    constraints: idempotency_key 唯一；status 为 passed/warning/blocked；target_version 为语义版本号
    indexes: [idx_release_validation_created(created_at DESC, validation_id DESC)]
    columns: {validation_id: 校验运行标识, target_version: 目标发布版本, idempotency_key: 请求幂等键, status: 总体就绪状态, summary_json: 脱敏汇总计数与说明, schema_version: 结构版本, created_at: 校验发生时间}
  release_validation_checks:
    description: 单次发布校验的有序检查明细；证据仅为脱敏运行元数据
    primary_key: [validation_id, check_id]
    foreign_keys: {validation_id: release_validations.validation_id ON DELETE CASCADE}
    indexes: [idx_release_validation_check_status(validation_id, status, position)]
    columns: {validation_id: 所属校验运行, check_id: 稳定检查标识, position: 展示顺序, title: 检查名称, status: passed/warning/blocked, code: 稳定结果码, message: 脱敏结果说明, evidence_json: 脱敏佐证数据, schema_version: 结构版本, created_at: 检查发生时间}
  multi_source_rules:
    description: 确定性跨来源关联规则；仅使用实体、来源、时间窗口、计数和风险阈值
    primary_key: rule_id
    columns: {rule_id: 规则标识, display_name: 显示名称, enabled: 是否启用, definition_json: 来源组合与阈值定义, version: 乐观版本, schema_version: 结构版本, created_at: 创建时间, updated_at: 更新时间}
  multi_source_observations:
    description: 从聚合模板窗口生成的脱敏多来源观察；不保存样例、原始日志或 message_core
    primary_key: observation_id
    indexes: [idx_multi_source_observation_time(cluster, window_start DESC), idx_multi_source_observation_source(source_family, window_start DESC)]
    columns: {observation_id: 稳定观察摘要, source_job_id: 来源任务, cluster: 集群, source_type: 原始来源类型, source_family: 规范来源族, component: 组件, severity: 严重度, template_hash: Drain3 模板摘要, template: 脱敏模板, occurrence_count: 聚合次数, risk_score: 实体风险分, risk_level: 风险等级, window_start: 窗口开始, window_end: 窗口结束, entity_keys_json: 规范实体键, relations_json: 显式实体层级关系, schema_version: 结构版本, created_at: 创建时间, updated_at: 更新时间}
  multi_source_correlations:
    description: 满足确定性规则的跨来源证据链头信息
    primary_key: correlation_id
    foreign_keys: {rule_id: multi_source_rules.rule_id}
    indexes: [idx_multi_source_correlation_entity(primary_entity_key, window_start DESC)]
    columns: {correlation_id: 稳定关联摘要, rule_id: 命中规则, rule_version: 命中时版本, cluster: 集群, primary_entity_key: 主实体键, window_start: 关联开始, window_end: 关联结束, confidence: 规则确定置信度, risk_score: 关联最高风险分, source_families_json: 来源族集合, schema_version: 结构版本, created_at: 创建时间, updated_at: 更新时间}
  multi_source_correlation_items:
    description: 关联证据链与脱敏观察的有序成员关系
    primary_key: [correlation_id, observation_id]
    foreign_keys: {correlation_id: multi_source_correlations.correlation_id ON DELETE CASCADE, observation_id: multi_source_observations.observation_id ON DELETE CASCADE}
    columns: {correlation_id: 关联标识, observation_id: 观察标识, position: 时间线位置}
  multi_source_audit_events:
    description: 多来源规则修改的追加式脱敏审计
    primary_key: audit_id
    indexes: [idx_multi_source_audit_created(created_at DESC, audit_id DESC)]
    columns: {audit_id: 审计标识, action: 操作, resource_type: 资源类型, resource_id: 资源标识, actor: 外部身份主体, request_id: 请求标识, attributes_json: 脱敏属性, schema_version: 结构版本, created_at: 创建时间}
  ai_cache_entries:
    description: Evidence、Prompt、Provider 和模型组合缓存
    primary_key: signature
    columns: {signature: 缓存组合签名, value_json: 通过校验的模型结果, created_at: 创建时间, updated_at: 最近命中或更新时间}
  processing_metrics_daily:
    description: 每日模型关联日志计数
    primary_key: metric_date
    constraints: llm_logs 不得小于 0
    columns: {metric_date: 本地统计日期, llm_logs: 实际进入模型 Evidence 的关联日志量, updated_at: 更新时间}
  upload_sessions:
    description: 大文件上传元数据；文件内容保存在文件系统
    primary_key: upload_id
    columns: {upload_id: 上传会话标识, status: 上传状态, filename: 原始文件名, source_path: 合并后文件路径, size_bytes: 文件字节数, sha256: 内容摘要, manifest_json: 分片和上传元数据, created_at: 创建时间, updated_at: 更新时间}
  input_jobs:
    description: 上传文件预处理任务、进度和结构化结果
    primary_key: input_job_id
    foreign_keys: {upload_id: upload_sessions.upload_id}
    columns: {input_job_id: 输入任务标识, upload_id: 来源上传会话, status: 任务状态, stage: 当前处理阶段, job_json: 输入任务配置, progress_json: 实时处理进度, result_json: 聚合后的 result.json, created_at: 创建时间, updated_at: 更新时间}
  streaming_tasks:
    description: 可恢复文件或预留 Kafka 来源的增量处理任务；来源游标、配置摘要与任务状态为运行时权威记录
    primary_key: task_id
    constraints: source_kind 仅允许 file/kafka；status 为 queued/running/failed/interrupted/completed/conflict；不保存原始日志或凭据
    indexes: [idx_streaming_tasks_status_updated(status, updated_at DESC)]
    columns: {task_id: 流式任务标识, source_kind: 来源类型, source_identity_json: 文件身份或 Kafka 非敏感来源快照, config_hash: 锁定的 Drain3 配置摘要, status: 运行状态, stage: READING/SPOOLING/MINING/AGGREGATING/COMPLETED/FAILED/CONFLICT, cursor_json: 最后成功提交的来源游标, task_json: 完整任务脱敏快照, created_at: 创建时间, updated_at: 更新时间}
  streaming_window_commits:
    description: 已原子提交的增量窗口；相同 task/window 只能提交一次
    primary_key: [task_id, window_id]
    foreign_keys: {task_id: streaming_tasks.task_id ON DELETE CASCADE}
