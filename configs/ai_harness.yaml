prompt_dir: prompts
trace:
  enabled: true
  path: state/ai_traces.jsonl
defaults:
  feature_extract: feature_extract_v3_compact_strict_json_en
  agent_plan: agent_plan_v1
agent_workflows:
  enabled: false
  allowed_roles: [evidence_specialist, rule_specialist, feature_specialist]
  max_nodes: 8
  max_concurrency: 4
  max_tool_calls: 40
  timeout_seconds: 900
  max_attempts: 3
  network_access: false
  approval_policy: human_required
prompts:
  - prompt_id: agent_plan_v1
    display_name: Agent 顺序规划 v1
    description: 用于受控白名单工具的单 Agent 顺序计划
    analysis_type: agent_plan
    status: active
    is_default: true
    version: v1
  - prompt_id: feature_extract_v1
    display_name: 日志特征识别 v1
    description: 用于从风险实体证据包中识别可复用异常特征
    analysis_type: feature_extract
    status: active
    is_default: false
    version: v1
  - prompt_id: feature_extract_v2_compact_en
    display_name: 日志特征识别 v2 Compact
    description: compact for 小参数模型
    analysis_type: feature_extract
    status: active
    is_default: false
    version: v2
  - prompt_id: feature_extract_v2_strict_en
    display_name: 日志特征识别 v2 Strict
    description: for 大参数模型
    analysis_type: feature_extract
    status: active
    is_default: false
    version: v2
  - prompt_id: feature_extract_v3_compact_strict_json_en
    display_name: 日志特征识别 v3 Compact Strict JSON
    description: compact strict JSON for 小参数模型
    analysis_type: feature_extract
    status: active
    is_default: true
    version: v3
