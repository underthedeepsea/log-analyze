schema_version: 1
database: logrisk
description: LOGRISK 运行时业务数据字典；SQLite 为当前实现，postgres_type 用于后续迁移 PostgreSQL。
authoritative_ddl: database/migrations/0001_initial.sql
conventions:
  timestamps: UTC ISO-8601 text
  booleans: SQLite INTEGER 0/1; PostgreSQL BOOLEAN
  json: SQLite TEXT with application validation; PostgreSQL JSONB
  identifiers: SQLite TEXT; PostgreSQL text（后续可按领域改为 uuid）
  autoincrement: SQLite INTEGER PRIMARY KEY AUTOINCREMENT; PostgreSQL bigint generated by default as identity
column_patterns:
  "*_id": 领域实体标识或外键；外键约束以 authoritative_ddl 为准
  "*_json": 经应用层 Schema 校验的完整快照或扩展字段
  "*_at": UTC ISO-8601 时间戳
  status: 领域状态；允许值由应用层或 DDL CHECK 约束
tables:
  schema_migrations:
    description: 已执行的数据库迁移版本和文件完整性校验
    primary_key: version
    columns: {version: 迁移序号, name: SQL 文件名, sha256: SQL 文件摘要, applied_at: 应用时间}
  legacy_imports:
    description: 旧文件幂等导入记录
    primary_key: source_path
    columns: {source_path: 旧状态文件绝对路径, source_sha256: 导入时文件摘要, records_imported: 导入记录数, imported_at: 导入时间}
  app_settings:
    description: 当前默认 Profile、活动配置等应用设置
    primary_key: setting_key
    columns: {setting_key: 设置键, value_json: 设置值, updated_at: 更新时间}
  provider_connections:
    description: Ollama 与 OpenAI-compatible API 连接；只保存密钥环境变量名
    primary_key: connection_id
    constraints: provider 仅允许 ollama/openai_compatible；超时必须大于 0；启用与默认标志为布尔值
    columns: {connection_id: 连接标识, display_name: 页面显示名, provider: Provider 类型, base_url: 服务根地址, api_key_env: API Key 环境变量名而非密钥, timeout_seconds: HTTP 超时秒数, enabled: 是否允许新任务使用, is_default: 是否为默认连接, created_at: 创建时间, updated_at: 更新时间}
  model_profiles:
    description: 绑定连接的模型参数、Prompt 和上下文预算
    primary_key: profile_id
    foreign_keys: {connection_id: provider_connections.connection_id}
    indexes: [idx_model_profiles_connection(connection_id)]
    columns: {profile_id: 模型画像标识, connection_id: Provider 连接, model: Provider 模型名, display_name: 页面显示名, enabled: 是否可选, structured_output_mode: json_schema/json_object/prompt_only, profile_json: 完整模型参数和预算, created_at: 创建时间, updated_at: 更新时间}
  prompt_templates:
    description: Prompt 元数据及当前版本指针
    primary_key: prompt_id
    columns: {prompt_id: Prompt 标识, analysis_type: 分析任务类型, display_name: 页面显示名, description: 用途说明, status: 生命周期状态, is_default: 是否为任务默认 Prompt, current_version: 当前版本号, created_at: 创建时间, updated_at: 更新时间}
  prompt_versions:
    description: 不可变 Prompt 内容版本
    primary_key: [prompt_id, version]
    foreign_keys: {prompt_id: prompt_templates.prompt_id}
    columns: {prompt_id: Prompt 标识, version: 递增版本号, content: Prompt 正文, content_sha256: 正文摘要, note: 版本备注, created_at: 创建时间}
  feature_jobs:
    description: 特征识别任务及创建时锁定的连接和模型快照
    primary_key: job_id
    foreign_keys: {model_profile_id: model_profiles.profile_id}
    columns: {job_id: 任务标识, status: 任务状态, model_profile_id: 所选 Profile, connection_snapshot_json: 创建时连接快照, profile_snapshot_json: 创建时 Profile 快照, job_json: 完整任务聚合状态, created_at: 创建时间, completed_at: 完成时间, updated_at: 更新时间}
  feature_job_entities:
    description: 任务内风险实体识别状态
    primary_key: [job_id, entity_id]
    foreign_keys: {job_id: feature_jobs.job_id ON DELETE CASCADE}
    columns: {job_id: 所属任务, entity_id: 风险实体标识, status: 实体处理状态, risk_score: 风险分, entity_json: 聚合且脱敏的实体证据, updated_at: 更新时间}
  feature_candidates:
    description: 模型或规则产生的待审批特征
    primary_key: candidate_id
    foreign_keys: {job_id: feature_jobs.job_id ON DELETE CASCADE}
    columns: {candidate_id: 候选特征标识, job_id: 所属任务, entity_id: 来源风险实体, status: 审批状态, candidate_json: 特征内容和 Evidence 引用, created_at: 创建时间, updated_at: 更新时间}
  feature_job_events:
    description: 特征任务顺序事件流
    primary_key: [job_id, sequence]
    foreign_keys: {job_id: feature_jobs.job_id ON DELETE CASCADE}
    columns: {job_id: 所属任务, sequence: 任务内递增序号, event_type: 事件类型, event_json: 事件详情, created_at: 发生时间}
  approved_rules:
    description: 人工批准且可复用的特征规则
    primary_key: rule_id
    constraints: signature 唯一
    columns: {rule_id: 规则标识, signature: 去重和匹配签名, feature_type: 特征类别, rule_json: 规则、Evidence 和 Lineage, approved_at: 批准时间, updated_at: 更新时间}
  rule_reuse_events:
    description: 批准规则复用审计记录
    primary_key: event_id
    foreign_keys: {rule_id: approved_rules.rule_id}
    columns: {event_id: 自增事件标识, rule_id: 命中规则, job_id: 命中任务, entity_id: 命中实体, reused_at: 复用时间}
  ai_traces:
    description: 脱敏后的模型调用观测记录
    primary_key: trace_id
    indexes: [idx_ai_traces_created(created_at DESC), idx_ai_traces_job(job_id)]
    columns: {trace_id: 调用追踪标识, job_id: 所属任务, provider: Provider 类型, model: 模型名, status: 调用或校验状态, prompt_id: Prompt 标识, prompt_hash: Prompt 内容摘要, latency_ms: 请求耗时毫秒, trace_json: 脱敏请求元数据与模型输出, created_at: 创建时间}
  ai_cache_entries:
    description: Evidence、Prompt、Provider 和模型组合缓存
    primary_key: signature
    columns: {signature: 缓存组合签名, value_json: 通过校验的模型结果, created_at: 创建时间, updated_at: 最近命中或更新时间}
  processing_metrics_daily:
    description: 每日模型关联日志计数
    primary_key: metric_date
    constraints: llm_logs 不得小于 0
    columns: {metric_date: 本地统计日期, llm_logs: 实际进入模型 Evidence 的关联日志量, updated_at: 更新时间}
  upload_sessions:
    description: 大文件上传元数据；文件内容保存在文件系统
    primary_key: upload_id
    columns: {upload_id: 上传会话标识, status: 上传状态, filename: 原始文件名, source_path: 合并后文件路径, size_bytes: 文件字节数, sha256: 内容摘要, manifest_json: 分片和上传元数据, created_at: 创建时间, updated_at: 更新时间}
  input_jobs:
    description: 上传文件预处理任务、进度和结构化结果
    primary_key: input_job_id
    foreign_keys: {upload_id: upload_sessions.upload_id}
    columns: {input_job_id: 输入任务标识, upload_id: 来源上传会话, status: 任务状态, stage: 当前处理阶段, job_json: 输入任务配置, progress_json: 实时处理进度, result_json: 聚合后的 result.json, created_at: 创建时间, updated_at: 更新时间}
  artifacts:
    description: 原始上传、分片、Drain3 快照和导出物路径与校验值
    primary_key: artifact_id
    columns: {artifact_id: 文件对象标识, owner_type: 所属领域类型, owner_id: 所属领域标识, artifact_type: 文件用途, path: 本地文件路径, size_bytes: 文件字节数, sha256: 内容摘要, created_at: 登记时间}
  drain_templates:
    description: 当前 Drain3 学习模板
    primary_key: template_hash
    columns: {template_hash: 模板摘要, component: 日志组件, status: 治理状态, template_json: 脱敏模板及统计, updated_at: 更新时间}
  drain_template_versions:
    description: Drain3 模板人工治理版本
    primary_key: [template_hash, version]
    foreign_keys: {template_hash: drain_templates.template_hash}
    columns: {template_hash: 模板摘要, version: 递增治理版本, template_json: 不可变模板快照, created_at: 创建时间}
  drain_template_events:
    description: Drain3 模板治理审计流
    primary_key: event_id
    columns: {event_id: 自增事件标识, template_hash: 目标模板, event_type: 编辑/忽略/合并/回滚等动作, event_json: 操作详情, created_at: 发生时间}
  drain_config_versions:
    description: Drain3 算法参数和脱敏规则完整版本
    primary_key: [config_id, version]
    columns: {config_id: 配置族标识, version: 递增版本, status: candidate/published 等状态, content: 完整 INI, content_hash: INI 摘要, config_json: 结构化参数和治理元数据, created_at: 创建时间}
  drain_config_events:
    description: Drain3 配置发布与回滚事件
    primary_key: event_id
    columns: {event_id: 自增事件标识, config_id: 配置族标识, version: 目标版本, event_type: 保存/校验/发布/回滚动作, event_json: 操作详情, created_at: 发生时间}
  drain_datasets:
    description: Drain3 Gold Dataset 及记录
    primary_key: dataset_id
    columns: {dataset_id: 数据集标识, name: 数据集名称, version: 数据集版本, dataset_json: 脱敏样本和元数据, created_at: 创建时间, updated_at: 更新时间}
  drain_annotations:
    description: Drain3 人工簇标注
    primary_key: annotation_id
    columns: {annotation_id: 标注标识, dataset_id: 所属数据集, annotation_json: 标注内容, created_at: 创建时间, updated_at: 更新时间}
  drain_reviews:
    description: Drain3 标注复核记录
    primary_key: review_id
    columns: {review_id: 复核标识, annotation_id: 被复核标注, review_json: 复核结论, created_at: 创建时间}
  drain_eval_runs:
    description: Drain3 配置质量评测结果
    primary_key: evaluation_id
    columns: {evaluation_id: 评测标识, status: 评测状态, evaluation_json: 配置快照和质量指标, created_at: 创建时间, completed_at: 完成时间}
  drain_tune_runs:
    description: Drain3 参数搜索任务与结果
    primary_key: tune_run_id
    columns: {tune_run_id: 调优任务标识, status: 调优状态, tune_json: 参数空间和结果, created_at: 创建时间, completed_at: 完成时间}
  semantic_dictionaries:
    description: 语义词典元数据和活动版本
    primary_key: dictionary_id
    columns: {dictionary_id: 词典标识, display_name: 页面显示名, active_version: 当前发布版本, dictionary_json: 内置规则和治理元数据, updated_at: 更新时间}
  semantic_dictionary_versions:
    description: 语义词典不可变版本
    primary_key: [dictionary_id, version]
    foreign_keys: {dictionary_id: semantic_dictionaries.dictionary_id}
    columns: {dictionary_id: 词典标识, version: 递增版本, status: candidate/published 等状态, dictionary_json: 完整规则快照, content_hash: 规则摘要, created_at: 创建时间}
  semantic_validation_runs:
    description: 语义词典版本校验结果
    primary_key: [dictionary_id, version]
    columns: {dictionary_id: 词典标识, version: 被校验版本, validation_json: 测试结果和失败项, created_at: 校验时间}
  semantic_events:
    description: 语义词典保存、发布和回滚事件
    primary_key: event_id
    columns: {event_id: 自增事件标识, dictionary_id: 词典标识, version: 目标版本, event_type: 保存/校验/发布/回滚动作, event_json: 操作详情, created_at: 发生时间}
postgres_type_mapping:
  TEXT: text
  TEXT_identifier: text
  TEXT_timestamp: timestamptz
  INTEGER_boolean: boolean
  INTEGER: bigint
  INTEGER_autoincrement: bigint generated by default as identity
  REAL: double_precision
  JSON_TEXT: jsonb
